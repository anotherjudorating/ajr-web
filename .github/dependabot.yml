# Weekly pull requests for outdated npm packages (security fixes come as soon as
# they are published). Vercel builds a preview of each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint (in eslint-config-next) supports TypeScript up to 6.0:
      # lint fails on 7 (https://github.com/typescript-eslint/typescript-eslint/issues/10940)
      - dependency-name: typescript
        versions: [">= 6.1"]
